<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Gates of Olympus - Slot Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a14;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* ====== GAME HOLDER FULLSCREEN ====== */
    #og-game-holder {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      background: #0b0719;
      overflow: hidden;
      z-index: 9999;
    }

    #og-game-holder iframe {
      display: block;
      position: absolute !important;
      border: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      outline: none !important;
    }
  </style>
</head>
<body>
  <div id="og-game-holder">
    <iframe
      id="gameIframe"
      src="https://demogamesfree.ppgames.net/gs2c/openGame.do?gameSymbol=vs20olympgate&websiteUrl=https%3A%2F%2Fdemogamesfree.pragmaticplay.net&jurisdiction=99&lobby_url=https%3A%2F%2Fwww.pragmaticplay.zone%2Fru%2F&lang=EN&cur=USD"
      allow="autoplay; fullscreen"
      allowfullscreen
      scrolling="no"
    ></iframe>
  </div>

  <script>
    (function () {
      var holder = document.getElementById('og-game-holder');
      var iframe = document.getElementById('gameIframe');
      var lastOrientation = '';

      function getViewportSize() {
        var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        return { w: Math.round(vw), h: Math.round(vh) };
      }

      function detectDeviceAndOrientation() {
        var size = getViewportSize();
        var isPortrait = size.h >= size.w;
        var orientation = isPortrait ? 'portrait' : 'landscape';

        if (lastOrientation !== orientation) {
          lastOrientation = orientation;
        }

        return {
          w: size.w,
          h: size.h,
          isPortrait: isPortrait,
          orientation: orientation
        };
      }

      /* ====== FULLSCREEN VERSION ====== */
      function applyFullscreen() {
        var info = detectDeviceAndOrientation();

        /* Holder memenuhi seluruh layar */
        var boxW = info.w;
        var boxH = info.h;

        holder.style.width = boxW + 'px';
        holder.style.height = boxH + 'px';
        holder.style.left = '0px';
        holder.style.top = '0px';
        holder.style.right = '0px';
        holder.style.bottom = '0px';

        /* Resolusi referensi internal agar UI Pragmatic Play tetap tajam & proporsional */
        var refW = info.isPortrait ? 720 : 1280;
        var refH = info.isPortrait ? 1280 : 720;

        /* Hitung skala agar iframe pas (cover/fit) di dalam layar */
        var scale = Math.min(boxW / refW, boxH / refH);

        /* Untuk fullscreen, pakai strategi "cover" supaya tidak ada letterbox hitam:
           perkecil skala jika rasio device lebih lebar/pendek dari referensi. */
        var scaleCover = Math.max(boxW / refW, boxH / refH);

        /* Pilih scaleCover agar benar-benar fullscreen tanpa border hitam.
           Kalau ingin tetap proporsional (letterbox), ganti ke `scale`. */
        var finalScale = scaleCover;

        var dw = refW * finalScale;
        var dh = refH * finalScale;

        iframe.style.setProperty('width', refW + 'px', 'important');
        iframe.style.setProperty('height', refH + 'px', 'important');
        iframe.style.setProperty('left', Math.round((boxW - dw) / 2) + 'px', 'important');
        iframe.style.setProperty('top', Math.round((boxH - dh) / 2) + 'px', 'important');
        iframe.style.setProperty('transform', 'scale(' + finalScale + ')', 'important');
        iframe.style.setProperty('transform-origin', 'top left', 'important');
        iframe.style.setProperty('max-width', 'none', 'important');
        iframe.style.setProperty('max-height', 'none', 'important');
      }

      function refit() {
        applyFullscreen();
        setTimeout(applyFullscreen, 100);
        setTimeout(applyFullscreen, 350);
        setTimeout(applyFullscreen, 800);
        setTimeout(applyFullscreen, 1500);
      }

      window.addEventListener('resize', applyFullscreen, false);
      window.addEventListener('orientationchange', refit, false);
      document.addEventListener('fullscreenchange', refit, false);
      document.addEventListener('webkitfullscreenchange', refit, false);

      if (window.screen && screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', refit);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyFullscreen);
        window.visualViewport.addEventListener('scroll', applyFullscreen);
      }

      refit();
    })();
  </script>
</body>
</html>
