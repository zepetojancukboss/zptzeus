<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gates of Olympus - Slot Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0719;
      overflow: hidden;
    }
    .game-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0719;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="game-wrapper" id="gameWrapper">
    <iframe
      id="gameIframe"
      src="https://demogamesfree.ppgames.net/gs2c/openGame.do?gameSymbol=vs20olympgate&websiteUrl=https%3A%2F%2Fdemogamesfree.pragmaticplay.net&jurisdiction=99&lobby_url=https%3A%2F%2Fwww.pragmaticplay.zone%2Fru%2F&lang=EN&cur=USD"
      allow="autoplay; fullscreen"
      allowfullscreen
      scrolling="no"
    ></iframe>
  </div>

  <script>
    const wrapper = document.getElementById('gameWrapper');

    function enterFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrapper.requestFullscreen) {
          wrapper.requestFullscreen().catch(() => {});
        } else if (wrapper.webkitRequestFullscreen) {
          wrapper.webkitRequestFullscreen();
        }
      }
    }

    // Coba masuk fullscreen saat halaman dimuat
    window.addEventListener('load', enterFullscreen);

    // Fallback: aktifkan fullscreen otomatis pada sentuhan/klik pertama jika browser memblokir auto-fullscreen
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, enterFullscreen, { once: true });
    });
  </script>
</body>
</html>
